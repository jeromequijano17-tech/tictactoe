<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tic-Tac-Toe Online</title>
<link rel="stylesheet" href="/static/css/style.css">
</head><body>
<main>
<h1>Tic-Tac-Toe</h1>
<section id="login" hidden>
  <p>Pick a guest name to play. No account needed.</p>
  <input id="name" maxlength="16" placeholder="Your name" autocomplete="off">
  <button id="loginBtn">Play as guest</button>
</section>
<section id="lobby" hidden>
  <p>Playing as <b id="who"></b></p>
  <button id="quick">Quick match</button>
  <button id="create">Create private room</button>
  <div class="row"><input id="code" maxlength="6" placeholder="ROOM CODE" autocomplete="off"><button id="join">Join</button></div>
  <nav><button data-tab="board">Leaderboard</button><button data-tab="hist">My history</button></nav>
  <table id="lb" hidden><thead><tr><th>#</th><th>Name</th><th>W</th><th>L</th><th>D</th><th>Pts</th></tr></thead><tbody></tbody></table>
  <table id="hist" hidden><thead><tr><th>Opponent</th><th>Result</th><th>When</th></tr></thead><tbody></tbody></table>
</section>
<section id="game" hidden>
  <p id="scores"></p>
  <p id="status" aria-live="polite"></p>
  <div id="grid"></div>
  <button id="rematch" hidden>Rematch</button>
  <button id="leave">Leave</button>
</section>
<p id="msg" role="alert"></p>
</main>
<script src="https://cdn.jsdelivr.net/npm/socket.io-client@4.7.5/dist/socket.io.min.js"></script>
<script src="/static/js/app.js"></script>
</body></html>
